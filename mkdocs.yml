site_name: ZamLine Technical Documentation
site_description: Technical documentation for the ZamLine logistics platform
site_url: ""
repo_name: nexa-technical-documentation
edit_uri: https://github.com/akirachix/nexa-technical-documentation/edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Start Here:
      - Overview: start-here/index.md
      - Documentation Guide: start-here/documentation-guide.md
  - Architecture:
      - Overview: architecture/index.md
      - System Context: architecture/system-context.md
  - Backend:
      - Overview: backend/index.md
  - AI:
      - Overview: ai/index.md
  - Frontend:
      - Overview: frontend/index.md
  - Platform:
      - Overview: platform/index.md
  - Security:
      - Overview: security/index.md
  - Developer Guide:
      - Overview: developer-guide/index.md
      - Setup: developer-guide/setup.md
  - Reference:
      - Overview: reference/index.md
